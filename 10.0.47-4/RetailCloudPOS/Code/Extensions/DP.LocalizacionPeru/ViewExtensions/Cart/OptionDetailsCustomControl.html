<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" name="format-detection" content="telephone=no" />
    <title></title>
    <link href="OptionDetailsCustomControl.css" rel="stylesheet" />
</head>
<body>
    <!-- Note: The element id is different than the id generated by the POS extensibility framework. This 'template' id is not used by the POS extensibility framework. -->
    <script id="DP_OSSMostrarMensaje_OptionDetails" type="text/html">
        <!--<div data-bind="msPosLoader: loader">
        </div>-->
        <div data-bind="visible:!_isLoaderVisible()">
            <table width="100%">
                <tr>
                    <td width="100%">
                        <div class="col h3 bottomLeft" data-bind="text: selectedOption"></div>
                        <select tabindex="8" id="optionPreference"
                                data-bind="options: optionPreferences,
                                        optionsText: 'description',
                                        attr: { title: Commerce.ViewModelAdapter.getResourceString('string_1326') },
                                        optionsValue: 'value',
                                        value: _selectedOption,
                                        optionsCaption: Commerce.ViewModelAdapter.getResourceString('string_1326')"></select>
                        <button id="btnToggle" class="boton_2" data-bind="click:toggleClicked">Aplicar documento</button>
                    </td>
                </tr>
                <tr>
                    <td width="100%">
                        <div id="optionName" class="h2 activeStatus" data-bind="text: name">Option Name</div>
                    </td>
                </tr>
            </table>

        </div>
        <div data-bind="visible: isErrorExists">
            <div class="h2" style="text-align:center; vertical-align:middle; margin-top:8%; color:red; white-space:pre-wrap;" data-bind="text: errorFromCR"></div>
        </div>
    </script>
</body>
</html>
