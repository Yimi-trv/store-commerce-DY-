<div class="customer-inline-dialog">
    <style>
        .customer-inline-dialog {
            min-width: 280px;
            max-width: 980px;
            width: 100%;
            padding: 12px 16px 16px 16px;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .customer-inline-dialog__tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            border-bottom: 1px solid #d8d8d8;
        }

        .customer-inline-dialog__tab {
            min-width: 0;
            flex: 1;
            padding: 8px 6px;
            border: 0;
            border-bottom: 3px solid transparent;
            background: transparent;
            color: #333;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .customer-inline-dialog__tab.is-active {
            border-bottom-color: #0063b1;
            color: #000;
            font-weight: 600;
        }

        .customer-inline-dialog__panel {
            display: none;
        }

        .customer-inline-dialog__panel.is-active {
            display: block;
        }

        .customer-inline-dialog__grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 600px) {
            .customer-inline-dialog__grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px 16px;
            }
        }

        .customer-inline-dialog__field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .customer-inline-dialog__field label {
            color: #333;
            font-size: 12px;
            font-weight: 600;
        }

        .customer-inline-dialog__field input,
        .customer-inline-dialog__field select {
            min-height: 32px;
            padding: 4px 8px;
            border: 1px solid #a6a6a6;
            font-size: 14px;
            box-sizing: border-box;
        }

        .customer-inline-dialog__actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 14px;
        }

        .customer-inline-dialog__action {
            min-width: 110px;
            min-height: 32px;
            border: 1px solid #0063b1;
            background: #0063b1;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .customer-inline-dialog__action--secondary {
            background: #fff;
            color: #0063b1;
        }

        .customer-inline-dialog__action:disabled {
            border-color: #9a9a9a;
            background: #d0d0d0;
            color: #555;
            cursor: default;
        }

        .customer-inline-dialog__result {
            min-height: 60px;
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #d8d8d8;
            background: #fafafa;
            color: #222;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.35;
            overflow-y: auto;
            max-height: 200px;
        }

        .customer-inline-dialog__message {
            min-height: 24px;
            margin-top: 10px;
            color: #605e5c;
            font-size: 12px;
        }
    </style>

    <div class="customer-inline-dialog__tabs">
        <button id="customerInlineTabSearchCreate" class="customer-inline-dialog__tab is-active" type="button">Buscar / Crear</button>
        <button id="customerInlineTabEdit" class="customer-inline-dialog__tab" type="button">Editar Cliente Actual</button>
    </div>

    <!-- PANEL BUSCAR/CREAR -->
    <div id="customerInlinePanelSearchCreate" class="customer-inline-dialog__panel is-active">
        <div class="customer-inline-dialog__grid">
            <div class="customer-inline-dialog__field">
                <label for="customerInlineSearchDocument">DNI (8 dígitos) o RUC (11 dígitos):</label>
                <input id="customerInlineSearchDocument" type="text" placeholder="Ej. 20123456789" />
            </div>
            <div class="customer-inline-dialog__field" style="justify-content: flex-end;">
                <button id="customerInlineSearchCreateButton" class="customer-inline-dialog__action" type="button">Procesar Documento</button>
            </div>
        </div>

        <div id="customerInlineSearchCreateResult" class="customer-inline-dialog__result"></div>
    </div>

    <!-- PANEL EDITAR -->
    <div id="customerInlinePanelEdit" class="customer-inline-dialog__panel">
        <div class="customer-inline-dialog__grid">
            <div class="customer-inline-dialog__field">
                <label for="customerInlineEditAccount">Cuenta:</label>
                <input id="customerInlineEditAccount" type="text" readonly style="background:#f3f2f1;" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineEditDocument">Documento SUNAT:</label>
                <input id="customerInlineEditDocument" type="text" />
            </div>
            <div class="customer-inline-dialog__field" style="grid-column: 1 / -1;">
                <label for="customerInlineEditName">Nombre completo / Razon Social:</label>
                <input id="customerInlineEditName" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineEditPhone">Telefono:</label>
                <input id="customerInlineEditPhone" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineEditEmail">Email:</label>
                <input id="customerInlineEditEmail" type="text" />
            </div>
        </div>

        <div class="customer-inline-dialog__actions">
            <button id="customerInlineEditSunatButton" class="customer-inline-dialog__action customer-inline-dialog__action--secondary" type="button">Validar con SUNAT</button>
            <button id="customerInlineEditButton" class="customer-inline-dialog__action" type="button">Guardar Cambios</button>
        </div>

        <div id="customerInlineEditResult" class="customer-inline-dialog__result"></div>
    </div>

    <div id="customerInlineMessage" class="customer-inline-dialog__message"></div>
</div>
