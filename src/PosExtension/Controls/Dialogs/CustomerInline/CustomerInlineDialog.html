<div class="customer-inline-dialog">
    <style>
        /* El ancho lo fija _applyDialogWidth sobre el contenedor del POS, calculado contra el
           viewport real (en caja puede ser 1024px). Aquí solo se ocupa todo lo disponible.
           Fijar un ancho mínimo grande aquí desbordaba el diálogo en pantallas chicas. */
        .customer-inline-dialog {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            padding: 16px;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* Dos columnas cuando hay sitio; una sola en pantallas angostas. */
        .customer-inline-dialog__grid {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .customer-inline-dialog__results {
            margin-top: 12px;
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid #d8d8d8;
        }

        /* table-layout fijo + anchos por columna: sin esto la columna Cuenta se angosta,
           "TRV-018284" parte en dos líneas y las líneas se enciman. */
        .customer-inline-dialog__results table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 14px;
        }

        .customer-inline-dialog__results th {
            position: sticky;
            top: 0;
            padding: 8px 10px;
            background: #f3f2f1;
            border-bottom: 1px solid #d8d8d8;
            text-align: left;
            font-weight: 600;
        }

        .customer-inline-dialog__results td {
            padding: 8px 10px;
            border-bottom: 1px solid #ededed;
            /* Una sola línea por celda: recortar es preferible a que el texto se encime. */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .customer-inline-dialog__results th:nth-child(1),
        .customer-inline-dialog__results td:nth-child(1) { width: 120px; }
        .customer-inline-dialog__results th:nth-child(2),
        .customer-inline-dialog__results td:nth-child(2) { width: 34%; }
        .customer-inline-dialog__results th:nth-child(4),
        .customer-inline-dialog__results td:nth-child(4) { width: 110px; }

        .customer-inline-dialog__results tbody tr {
            cursor: pointer;
        }

        .customer-inline-dialog__results tbody tr:hover {
            background: #eaf3fb;
        }

        .customer-inline-dialog__tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            border-bottom: 1px solid #d8d8d8;
        }

        .customer-inline-dialog__tab {
            min-width: 0;
            flex: 1;
            padding: 10px 8px;
            border: 0;
            border-bottom: 3px solid transparent;
            background: transparent;
            color: #333;
            text-align: center;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
        }

        .customer-inline-dialog__tab.is-active {
            border-bottom-color: #0063b1;
            color: #000;
            font-weight: 600;
        }

        .customer-inline-dialog__panel {
            display: none;
        }

        .customer-inline-dialog__panel.is-active {
            display: block;
        }

        .customer-inline-dialog__grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        /* Forced 1 column layout to fit in narrow POS sidebar dialogs */

        .customer-inline-dialog__field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .customer-inline-dialog__field label {
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .customer-inline-dialog__field input,
        .customer-inline-dialog__field select {
            min-height: 36px;
            padding: 6px 10px;
            border: 1px solid #a6a6a6;
            font-size: 15px;
            box-sizing: border-box;
        }

        .customer-inline-dialog__actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }

        .customer-inline-dialog__action {
            min-width: 120px;
            min-height: 36px;
            border: 1px solid #0063b1;
            background: #0063b1;
            color: #fff;
            font-size: 15px;
            padding: 0 16px;
            cursor: pointer;
        }

        .customer-inline-dialog__action--secondary {
            background: #fff;
            color: #0063b1;
        }

        .customer-inline-dialog__action:disabled {
            border-color: #9a9a9a;
            background: #d0d0d0;
            color: #555;
            cursor: default;
        }

        .customer-inline-dialog__result {
            min-height: 60px;
            margin-top: 12px;
            padding: 10px;
            border: 1px solid #d8d8d8;
            background: #fafafa;
            color: #222;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.4;
            overflow-y: auto;
            max-height: 220px;
        }

        .customer-inline-dialog__message {
            min-height: 26px;
            margin-top: 12px;
            color: #605e5c;
            font-size: 14px;
        }
    </style>

    <div class="customer-inline-dialog__tabs">
        <button id="customerInlineTabSearch" class="customer-inline-dialog__tab is-active" type="button">Buscar Cliente</button>
        <button id="customerInlineTabCreate" class="customer-inline-dialog__tab" type="button">Crear con SUNAT</button>
        <button id="customerInlineTabEdit" class="customer-inline-dialog__tab" type="button">Editar Actual</button>
    </div>

    <!-- PANEL BUSCAR -->
    <div id="customerInlinePanelSearch" class="customer-inline-dialog__panel is-active">
        <div class="customer-inline-dialog__grid">
            <div class="customer-inline-dialog__field">
                <label for="customerInlineSearchText">Nombre, cuenta o número de documento:</label>
                <input id="customerInlineSearchText" type="text" placeholder="Ej. 20123456789 o PEREZ" />
            </div>
        </div>
        <div class="customer-inline-dialog__actions">
            <button id="customerInlineSearchNativeBtn" type="button" class="customer-inline-dialog__action customer-inline-dialog__action--secondary">
                Abrir buscador del POS
            </button>
            <button id="customerInlineSearchBtn" type="button" class="customer-inline-dialog__action">
                Buscar
            </button>
        </div>
        <div id="customerInlineSearchResults" class="customer-inline-dialog__results"></div>
        <div id="customerInlineSearchResult" class="customer-inline-dialog__result">Escriba y presione Buscar. Toque un resultado para asignarlo a esta venta.</div>
    </div>

    <!-- PANEL CREAR -->
    <div id="customerInlinePanelCreate" class="customer-inline-dialog__panel">
        <div class="customer-inline-dialog__grid">
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateDocument">Documento SUNAT (8 u 11 dígitos):</label>
                <input id="customerInlineCreateDocument" type="text" placeholder="Ej. 20123456789" />
            </div>
            <div class="customer-inline-dialog__field" style="justify-content: flex-end;">
                <button id="customerInlineCreateSunatButton" class="customer-inline-dialog__action customer-inline-dialog__action--secondary" type="button" style="width: 100%;">1. Consultar SUNAT</button>
            </div>
            <div class="customer-inline-dialog__field" style="grid-column: 1 / -1;">
                <label for="customerInlineCreateName">Nombre completo / Razon Social:</label>
                <input id="customerInlineCreateName" type="text" />
            </div>
            <!-- Solo para PERSONA (DNI y RUC 10/15/17). D365 exige apellidos y nombres
                 separados en una persona; con solo el nombre completo rechaza el alta con
                 "Los campos de nombre son campos obligatorios".
                 El corte que hace SUNAT es una heurística, así que quedan editables. -->
            <div class="customer-inline-dialog__field" id="customerInlineCreateLastNameField">
                <label for="customerInlineCreateLastName">Apellidos:</label>
                <input id="customerInlineCreateLastName" type="text" />
            </div>
            <div class="customer-inline-dialog__field" id="customerInlineCreateFirstNameField">
                <label for="customerInlineCreateFirstName">Nombres:</label>
                <input id="customerInlineCreateFirstName" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateCustomerType">Tipo de cliente:</label>
                <!-- Se preselecciona al consultar SUNAT: RUC 20 es Organización, DNI es Persona.
                     El value es el CustomerType numérico del SDK. -->
                <select id="customerInlineCreateCustomerType">
                    <option value="1">Persona</option>
                    <option value="2">Organización</option>
                </select>
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateCustomerGroup">Grupo de clientes:</label>
                <!-- Se carga en onReady desde los grupos configurados en el canal. -->
                <select id="customerInlineCreateCustomerGroup"></select>
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreatePhone">Telefono:</label>
                <input id="customerInlineCreatePhone" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateEmail">Email:</label>
                <input id="customerInlineCreateEmail" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateCondition">Condición:</label>
                <input id="customerInlineCreateCondition" type="text" />
            </div>
            <div class="customer-inline-dialog__field" style="grid-column: 1 / -1;">
                <label>Datos Perú:</label>
                <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px;">
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreateRetention" type="checkbox" /> Agente Retención
                    </label>
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreatePerception" type="checkbox" /> Agente Percepción
                    </label>
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreatePublicSector" type="checkbox" /> Sector Público
                    </label>
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreateEmergencyZone" type="checkbox" /> Zona de emergencia
                    </label>
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreateExoneratedPerception" type="checkbox" /> Exonerado percepción
                    </label>
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreateFinalConsumer" type="checkbox" /> Consumidor final
                    </label>
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreateOthers" type="checkbox" /> Otros
                    </label>
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreateNotDomiciled" type="checkbox" /> No domiciliado
                    </label>
                </div>
            </div>
        </div>
        <div class="customer-inline-dialog__actions">
            <!-- El caso "documento ya registrado" se resuelve con la alerta flotante del POS
                 (ShowMessageDialogClientRequest), no con un botón aquí: es una decisión que el
                 cajero debe tomar y no algo que pueda pasar por alto. -->
        </div>
    </div>


    <!-- PANEL EDITAR -->
    <div id="customerInlinePanelEdit" class="customer-inline-dialog__panel">
        <div class="customer-inline-dialog__grid">
            <div class="customer-inline-dialog__field">
                <label for="customerInlineEditAccount">Cuenta:</label>
                <input id="customerInlineEditAccount" type="text" readonly style="background:#f3f2f1;" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineEditDocument">Documento SUNAT:</label>
                <input id="customerInlineEditDocument" type="text" />
            </div>
            <div class="customer-inline-dialog__field" style="grid-column: 1 / -1;">
                <label for="customerInlineEditName">Nombre completo / Razon Social:</label>
                <input id="customerInlineEditName" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineEditPhone">Telefono:</label>
                <input id="customerInlineEditPhone" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineEditEmail">Email:</label>
                <input id="customerInlineEditEmail" type="text" />
            </div>
        </div>

    </div>

    <!-- SECCION DE DIRECCION — COMPARTIDA POR CREAR Y EDITAR
         Vive fuera de los paneles a propósito: la dirección se llena igual en ambos flujos y
         duplicarla obligaría a mantener dos cascadas geográficas. _setMode la muestra en crear
         y editar, y la oculta en buscar.
         Los ids conservan el prefijo "Create" por historia; hoy son compartidos. -->
    <div id="customerInlineAddressSection" style="display: none;">
        <h3 style="margin: 18px 0 8px; font-size: 15px; font-weight: 600; color: #333; border-top: 1px solid #d8d8d8; padding-top: 14px;">Dirección</h3>
        <div class="customer-inline-dialog__grid">
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateAddressPurpose">Propósito de la dirección:</label>
                <!-- Las opciones se cargan en onReady desde los propósitos del canal, o desde
                     el enum AddressType de D365 si el canal no los expone. El value es el
                     AddressType numérico, no una etiqueta. -->
                <select id="customerInlineCreateAddressPurpose"></select>
            </div>
            <div class="customer-inline-dialog__field">
                <label style="font-weight: normal; font-size: 14px; display: flex; align-items: center; gap: 6px; margin-top: 22px;">
                    <input id="customerInlineCreateAddressPrimary" type="checkbox" checked /> Dirección principal
                </label>
            </div>
            <div class="customer-inline-dialog__field" style="grid-column: 1 / -1;">
                <label for="customerInlineCreateAddress">Calle / Dirección fiscal:</label>
                <input id="customerInlineCreateAddress" type="text" />
            </div>
            <!-- Los mismos campos que la pantalla estándar de dirección: sin ellos la dirección
                 se creaba sin número ni piso/interior. -->
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateStreetNumber">Número de calle:</label>
                <input id="customerInlineCreateStreetNumber" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateBuildingCompliment">Complemento (piso, interior, mz/lote):</label>
                <input id="customerInlineCreateBuildingCompliment" type="text" />
            </div>
            <!-- Desplegables en cascada alimentados desde los maestros geográficos de D365.
                 Antes eran texto libre y un solo carácter distinto hacía que el ubigeo no
                 resolviera y la dirección se descartara en silencio. -->
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateDepartment">Departamento:</label>
                <select id="customerInlineCreateDepartment"></select>
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateProvince">Provincia:</label>
                <select id="customerInlineCreateProvince" disabled></select>
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateDistrict">Distrito:</label>
                <select id="customerInlineCreateDistrict" disabled></select>
            </div>
        </div>
    </div>

    <!-- ACCIONES Y RESULTADO — SIEMPRE AL FINAL
         Salen de los paneles para quedar debajo de la sección de dirección: al mover la
         dirección fuera del panel de Crear, el botón de crear quedaba a media pantalla y el
         cajero podía darle antes de completar la dirección. _setMode muestra el juego que
         corresponde al modo. -->
    <div id="customerInlineCreateActions" class="customer-inline-dialog__actions" style="display: none;">
        <button id="customerInlineCreateButton" class="customer-inline-dialog__action" type="button">2. Crear en Sistema y Asignar</button>
    </div>

    <div id="customerInlineEditActions" class="customer-inline-dialog__actions" style="display: none;">
        <button id="customerInlineEditSunatButton" class="customer-inline-dialog__action customer-inline-dialog__action--secondary" type="button">Validar con SUNAT</button>
        <button id="customerInlineEditButton" class="customer-inline-dialog__action" type="button">Guardar Cambios</button>
    </div>

    <div id="customerInlineCreateResult" class="customer-inline-dialog__result" style="display: none;"></div>
    <div id="customerInlineEditResult" class="customer-inline-dialog__result" style="display: none;"></div>

    <div id="customerInlineMessage" class="customer-inline-dialog__message"></div>
</div>
