<div class="customer-inline-dialog">
    <style>
        /* TEMA OSCURO
           La paleta sale de Theme/ThemeAssets.ts, la misma del tema Trujillo Market que ya
           aplica el resto de Store Commerce. No se inventan colores: un modal con su propio
           gris se leería como una pantalla de otra aplicación pegada dentro del POS.

             #1B1A19  fondo             #201F1E  superficie elevada (campos, resultados)
             #161514  cabeceras         #E8E6E3  texto            #A19F9D  texto secundario
             #C8102E  acento            #A81020  acento presionado

           El chrome del diálogo del POS —la cabecera "Cliente", la X y el botón Cerrar— NO
           está dentro de esta plantilla y no se puede alcanzar desde aquí: lo oscurece
           _applyDialogTheme recorriendo el DOM. */

        /* El ancho lo fija _applyDialogWidth sobre el contenedor del POS, calculado contra el
           viewport real (en caja puede ser 1024px). Aquí solo se ocupa todo lo disponible.
           Fijar un ancho mínimo grande aquí desbordaba el diálogo en pantallas chicas. */
        .customer-inline-dialog {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            padding: 16px;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #1B1A19;
            color: #E8E6E3;
            /* Hace que el navegador dibuje en oscuro lo que no controlamos por CSS: la flecha
               del select, su lista desplegable, el cursor y las barras de scroll. Sin esto los
               desplegables se abren en blanco sobre el modal oscuro. */
            color-scheme: dark;
        }

        /* Dos columnas cuando hay sitio; una sola en pantallas angostas. */
        .customer-inline-dialog__grid {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .customer-inline-dialog__results {
            margin-top: 12px;
            /* ~5 filas de 56px más la cabecera: con filas más altas el tope anterior (320px)
               dejaba ver solo tres y obligaba a desplazar casi siempre. */
            max-height: 360px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.16);
        }

        /* table-layout fijo + anchos por columna: sin esto la columna Cuenta se angosta,
           "TRV-018284" parte en dos líneas y las líneas se enciman. */
        .customer-inline-dialog__results table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 14px;
        }

        .customer-inline-dialog__results th {
            position: sticky;
            top: 0;
            padding: 8px 10px;
            background: #161514;
            border-bottom: 1px solid rgba(255, 255, 255, 0.16);
            color: #E8E6E3;
            text-align: left;
            font-weight: 600;
        }

        /* FILAS ALTAS PARA TOCAR CON EL DEDO.
           Con 8px de padding cada fila medía ~32px y en una pantalla táctil era fácil tocar la
           de arriba o la de abajo y asignar a la venta un cliente equivocado. 56px es el mínimo
           cómodo para un dedo; el separador más marcado y la fuente un punto mayor ayudan a
           leer cuál es cuál antes de tocar. */
        .customer-inline-dialog__results td {
            /* El alto total sale del padding: en una celda `height` se suma al padding y daba
               77px. 19px arriba y abajo con una linea de ~20px son ~58px por fila. */
            padding: 19px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
            font-size: 15px;
            vertical-align: middle;
            /* Una sola línea por celda: recortar es preferible a que el texto se encime. */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .customer-inline-dialog__results th:nth-child(1),
        .customer-inline-dialog__results td:nth-child(1) { width: 120px; }
        .customer-inline-dialog__results th:nth-child(2),
        .customer-inline-dialog__results td:nth-child(2) { width: 34%; }
        .customer-inline-dialog__results th:nth-child(4),
        .customer-inline-dialog__results td:nth-child(4) { width: 110px; }

        .customer-inline-dialog__results tbody tr {
            cursor: pointer;
        }

        /* El resaltado es el rojo del tema al 18%: en oscuro un azul claro salta como si fuera
           un error y además no pertenece a esta paleta. */
        .customer-inline-dialog__results tbody tr:hover {
            background: rgba(200, 16, 46, 0.18);
        }

        /* En táctil no hay hover: el estado :active es lo único que confirma qué fila se está
           presionando. Más intenso que el hover y con la franja roja a la izquierda. */
        .customer-inline-dialog__results tbody tr:active {
            background: rgba(200, 16, 46, 0.32);
            box-shadow: inset 4px 0 0 #C8102E;
        }

        .customer-inline-dialog__tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.16);
        }

        .customer-inline-dialog__tab {
            min-width: 0;
            flex: 1;
            padding: 10px 8px;
            border: 0;
            border-bottom: 3px solid transparent;
            background: transparent;
            color: #A19F9D;
            text-align: center;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
        }

        .customer-inline-dialog__tab:hover {
            color: #E8E6E3;
        }

        .customer-inline-dialog__tab.is-active {
            border-bottom-color: #C8102E;
            color: #FFFFFF;
            font-weight: 600;
        }

        .customer-inline-dialog__panel {
            display: none;
        }

        .customer-inline-dialog__panel.is-active {
            display: block;
        }

        .customer-inline-dialog__grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        /* Forced 1 column layout to fit in narrow POS sidebar dialogs */

        .customer-inline-dialog__field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .customer-inline-dialog__field label {
            color: #E8E6E3;
            font-size: 14px;
            font-weight: 600;
        }

        .customer-inline-dialog__field input,
        .customer-inline-dialog__field select {
            min-height: 36px;
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: #201F1E;
            color: #E8E6E3;
            font-size: 15px;
            box-sizing: border-box;
        }

        .customer-inline-dialog__field input:focus,
        .customer-inline-dialog__field select:focus {
            outline: none;
            border-color: #C8102E;
        }

        .customer-inline-dialog__field input::placeholder {
            color: #7A7876;
        }

        .customer-inline-dialog__field input[readonly] {
            background: #161514;
            color: #A19F9D;
        }

        .customer-inline-dialog__actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }

        .customer-inline-dialog__action {
            min-width: 120px;
            min-height: 36px;
            border: 1px solid #C8102E;
            background: #C8102E;
            color: #fff;
            font-size: 15px;
            padding: 0 16px;
            cursor: pointer;
        }

        .customer-inline-dialog__action:hover {
            background: #A81020;
            border-color: #A81020;
        }

        .customer-inline-dialog__action--secondary {
            background: transparent;
            color: #E8E6E3;
        }

        .customer-inline-dialog__action--secondary:hover {
            background: rgba(200, 16, 46, 0.20);
        }

        /* ACCIÓN PRINCIPAL DEL MODAL.
           "Crear en Sistema y Asignar" es el botón que dispara todo el proceso —alta del
           cliente, dirección, propiedades SUNAT y asignación a la venta— y tenía el mismo
           tamaño que un botón secundario. Ocupa el ancho completo y crece en alto y en
           tipografía para que sea lo que el cajero encuentra sin buscar.
           Se aplica igual a "Guardar Cambios": es la acción principal del modo editar y
           dejarlas distintas se leería como un descuido. */
        .customer-inline-dialog__action--cta {
            flex: 1 1 100%;
            min-height: 56px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.2px;
            box-shadow: 0 2px 10px rgba(200, 16, 46, 0.35);
        }

        .customer-inline-dialog__action:disabled {
            border-color: rgba(255, 255, 255, 0.18);
            background: #2A2827;
            color: #7A7876;
            cursor: default;
        }

        .customer-inline-dialog__result {
            min-height: 60px;
            margin-top: 12px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: #201F1E;
            color: #E8E6E3;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.4;
            overflow-y: auto;
            max-height: 220px;
        }

        .customer-inline-dialog__message {
            min-height: 26px;
            margin-top: 12px;
            color: #A19F9D;
            font-size: 14px;
        }

        .customer-inline-dialog__section-title {
            margin: 18px 0 8px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            color: #E8E6E3;
            font-size: 15px;
            font-weight: 600;
        }

        /* ALERTA FLOTANTE PROPIA.
           No se usa ShowMessageDialogClientRequest porque el POS no apila un diálogo de mensaje
           sobre un templated dialog abierto: la petición falla y el aviso nunca llega a verse.
           Al pintarla en el DOM del propio modal siempre aparece.
           position:fixed —no absolute— para que no la recorte el overflow del contenedor. */
        .customer-inline-dialog__overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.70);
            /* Por encima de cualquier capa del POS. */
            z-index: 2147483000;
            padding: 16px;
            box-sizing: border-box;
        }

        .customer-inline-dialog__alert {
            width: 100%;
            max-width: 460px;
            background: #201F1E;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-top: 4px solid #C8102E;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
            padding: 20px;
            box-sizing: border-box;
        }

        .customer-inline-dialog__alert-title {
            margin: 0 0 6px 0;
            /* Sobre oscuro el rojo del tema no tiene contraste suficiente para texto: se usa
               un tono más claro de la misma familia. */
            color: #FF6B6B;
            font-size: 18px;
            font-weight: 600;
        }

        .customer-inline-dialog__alert-body {
            margin: 0 0 18px 0;
            color: #E8E6E3;
            font-size: 15px;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        .customer-inline-dialog__alert-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        /* ─── REFUERZO CONTRA EL CSS DEL POS ───────────────────────────────────────────
           Store Commerce declara sus estilos de formulario con !important, así que las
           reglas de arriba no bastaban: los input seguían saliendo blancos sobre el modal
           oscuro aunque los select sí tomaban el tema.

           Aquí se repiten SOLO las propiedades de color, con !important y con la clase raíz
           duplicada —`.customer-inline-dialog.customer-inline-dialog`— que sube la
           especificidad por encima de las reglas del host sin tocar el marcado ni añadir
           clases nuevas.

           Va en un bloque aparte a propósito: arriba está el diseño, aquí la defensa contra
           el CSS del host. Si el POS deja de pisar estos estilos, este bloque se puede
           borrar entero sin tocar lo demás. */

        /* Los checkbox quedan fuera: con color-scheme dark el navegador ya los dibuja
           oscuros, y darles fondo y borde propios los deforma. */
        .customer-inline-dialog.customer-inline-dialog input:not([type="checkbox"]),
        .customer-inline-dialog.customer-inline-dialog select,
        .customer-inline-dialog.customer-inline-dialog textarea {
            background-color: #201F1E !important;
            color: #E8E6E3 !important;
            border: 1px solid rgba(255, 255, 255, 0.24) !important;
        }

        .customer-inline-dialog.customer-inline-dialog input:not([type="checkbox"]):focus,
        .customer-inline-dialog.customer-inline-dialog select:focus {
            border-color: #C8102E !important;
        }

        .customer-inline-dialog.customer-inline-dialog input[readonly] {
            background-color: #161514 !important;
            color: #A19F9D !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__tab {
            background-color: transparent !important;
            border: 0 !important;
            border-bottom: 3px solid transparent !important;
            color: #A19F9D !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__tab.is-active {
            border-bottom: 3px solid #C8102E !important;
            color: #FFFFFF !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__action {
            background-color: #C8102E !important;
            border: 1px solid #C8102E !important;
            color: #FFFFFF !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__action--cta {
            min-height: 56px !important;
            font-size: 18px !important;
            font-weight: 600 !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__action--secondary {
            background-color: transparent !important;
            color: #E8E6E3 !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__action:disabled {
            background-color: #2A2827 !important;
            border-color: rgba(255, 255, 255, 0.18) !important;
            color: #7A7876 !important;
        }

        .customer-inline-dialog.customer-inline-dialog label,
        .customer-inline-dialog.customer-inline-dialog h3 {
            color: #E8E6E3 !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__result {
            background-color: #201F1E !important;
            color: #E8E6E3 !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__message {
            color: #A19F9D !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__results th {
            background-color: #161514 !important;
            color: #E8E6E3 !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__results td {
            background-color: transparent !important;
            color: #E8E6E3 !important;
            padding: 19px 12px !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__alert {
            background-color: #201F1E !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__alert-title {
            color: #FF6B6B !important;
        }

        .customer-inline-dialog.customer-inline-dialog .customer-inline-dialog__alert-body {
            color: #E8E6E3 !important;
        }

        /* Las reglas del contenedor que el POS monta alrededor NO estan aqui: viven en
           _ensureHostStyle (CustomerInlineDialog.ts) y se inyectan en el <head> al abrir.
           Este <style> viaja DENTRO de la plantilla, y en la primera apertura el POS aun
           no la ha cargado: dibujaba el dialogo con su ancho por defecto y se veia el
           salto. Por eso el ancho del contenedor se inyecta antes, desde codigo. */
    </style>

    <div class="customer-inline-dialog__tabs">
        <button id="customerInlineTabSearch" class="customer-inline-dialog__tab is-active" type="button">Buscar Cliente</button>
        <button id="customerInlineTabCreate" class="customer-inline-dialog__tab" type="button">Crear Cliente</button>
        <button id="customerInlineTabEdit" class="customer-inline-dialog__tab" type="button">Editar Actual</button>
    </div>

    <!-- PANEL BUSCAR -->
    <div id="customerInlinePanelSearch" class="customer-inline-dialog__panel is-active">
        <div class="customer-inline-dialog__grid">
            <div class="customer-inline-dialog__field">
                <label for="customerInlineSearchText">Nombre, cuenta o número de documento:</label>
                <input id="customerInlineSearchText" type="text" placeholder="Ej. 20123456789 o PEREZ" />
            </div>
        </div>
        <div class="customer-inline-dialog__actions">
            <button id="customerInlineSearchNativeBtn" type="button" class="customer-inline-dialog__action customer-inline-dialog__action--secondary">
                Abrir buscador del POS
            </button>
            <button id="customerInlineSearchBtn" type="button" class="customer-inline-dialog__action">
                Buscar
            </button>
        </div>
        <div id="customerInlineSearchResults" class="customer-inline-dialog__results"></div>
        <div id="customerInlineSearchResult" class="customer-inline-dialog__result">Escriba y presione Buscar. Toque un resultado para asignarlo a esta venta.</div>
    </div>

    <!-- PANEL CREAR -->
    <div id="customerInlinePanelCreate" class="customer-inline-dialog__panel">
        <div class="customer-inline-dialog__grid">
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateDocument">Documento SUNAT (8 u 11 dígitos):</label>
                <input id="customerInlineCreateDocument" type="text" placeholder="Ej. 20123456789" />
            </div>
            <div class="customer-inline-dialog__field" style="justify-content: flex-end;">
                <button id="customerInlineCreateSunatButton" class="customer-inline-dialog__action customer-inline-dialog__action--secondary" type="button" style="width: 100%;">1. Consultar SUNAT</button>
            </div>
            <div class="customer-inline-dialog__field" style="grid-column: 1 / -1;">
                <label for="customerInlineCreateName">Nombre completo / Razon Social:</label>
                <input id="customerInlineCreateName" type="text" />
            </div>
            <!-- Solo para PERSONA (DNI y RUC 10/15/17). D365 exige apellidos y nombres
                 separados en una persona; con solo el nombre completo rechaza el alta con
                 "Los campos de nombre son campos obligatorios".
                 El corte que hace SUNAT es una heurística, así que quedan editables. -->
            <div class="customer-inline-dialog__field" id="customerInlineCreateLastNameField">
                <label for="customerInlineCreateLastName">Apellidos:</label>
                <input id="customerInlineCreateLastName" type="text" />
            </div>
            <div class="customer-inline-dialog__field" id="customerInlineCreateFirstNameField">
                <label for="customerInlineCreateFirstName">Nombres:</label>
                <input id="customerInlineCreateFirstName" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateCustomerType">Tipo de cliente:</label>
                <!-- Se preselecciona al consultar SUNAT: RUC 20 es Organización, DNI es Persona.
                     El value es el CustomerType numérico del SDK. -->
                <select id="customerInlineCreateCustomerType">
                    <option value="1">Persona</option>
                    <option value="2">Organización</option>
                </select>
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateCustomerGroup">Grupo de clientes:</label>
                <!-- Se carga en onReady desde los grupos configurados en el canal. -->
                <select id="customerInlineCreateCustomerGroup"></select>
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreatePhone">Telefono:</label>
                <input id="customerInlineCreatePhone" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateEmail">Email:</label>
                <input id="customerInlineCreateEmail" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateCondition">Condición:</label>
                <input id="customerInlineCreateCondition" type="text" />
            </div>
            <div class="customer-inline-dialog__field" style="grid-column: 1 / -1;">
                <label>Datos Perú:</label>
                <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px;">
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">

                    </label>
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreatePublicSector" type="checkbox" /> Sector Público

                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">

                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">

                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreateFinalConsumer" type="checkbox" /> Consumidor final
                    </label>
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreateOthers" type="checkbox" /> Otros
                    </label>
                    <label style="font-weight: normal; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <input id="customerInlineCreateNotDomiciled" type="checkbox" /> No domiciliado
                    </label>
                </div>
            </div>
        </div>
        <div class="customer-inline-dialog__actions">
            <!-- El caso "documento ya registrado" se resuelve con la alerta flotante del POS
                 (ShowMessageDialogClientRequest), no con un botón aquí: es una decisión que el
                 cajero debe tomar y no algo que pueda pasar por alto. -->
        </div>
    </div>


    <!-- PANEL EDITAR -->

    <!-- SECCION DE DIRECCION — COMPARTIDA POR CREAR Y EDITAR
         Vive fuera de los paneles a propósito: la dirección se llena igual en ambos flujos y
         duplicarla obligaría a mantener dos cascadas geográficas. _setMode la muestra en crear
         y editar, y la oculta en buscar.
         Los ids conservan el prefijo "Create" por historia; hoy son compartidos. -->
    <div id="customerInlineAddressSection" style="display: none;">
        <h3 class="customer-inline-dialog__section-title">Dirección</h3>
        <div class="customer-inline-dialog__grid">
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateAddressPurpose">Propósito de la dirección:</label>
                <!-- Las opciones se cargan en onReady desde los propósitos del canal, o desde
                     el enum AddressType de D365 si el canal no los expone. El value es el
                     AddressType numérico, no una etiqueta. -->
                <select id="customerInlineCreateAddressPurpose"></select>
            </div>
            <div class="customer-inline-dialog__field">
                <label style="font-weight: normal; font-size: 14px; display: flex; align-items: center; gap: 6px; margin-top: 22px;">
                    <input id="customerInlineCreateAddressPrimary" type="checkbox" checked /> Dirección principal
                </label>
            </div>
            <div class="customer-inline-dialog__field" style="grid-column: 1 / -1;">
                <label for="customerInlineCreateAddress">Calle / Dirección fiscal:</label>
                <input id="customerInlineCreateAddress" type="text" />
            </div>
            <!-- Los mismos campos que la pantalla estándar de dirección: sin ellos la dirección
                 se creaba sin número ni piso/interior. -->
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateStreetNumber">Número de calle:</label>
                <input id="customerInlineCreateStreetNumber" type="text" />
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateBuildingCompliment">Complemento (piso, interior, mz/lote):</label>
                <input id="customerInlineCreateBuildingCompliment" type="text" />
            </div>
            <!-- Desplegables en cascada alimentados desde los maestros geográficos de D365.
                 Antes eran texto libre y un solo carácter distinto hacía que el ubigeo no
                 resolviera y la dirección se descartara en silencio. -->
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateDepartment">Departamento:</label>
                <select id="customerInlineCreateDepartment"></select>
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateProvince">Provincia:</label>
                <select id="customerInlineCreateProvince" disabled></select>
            </div>
            <div class="customer-inline-dialog__field">
                <label for="customerInlineCreateDistrict">Distrito:</label>
                <select id="customerInlineCreateDistrict" disabled></select>
            </div>
        </div>
    </div>

    <!-- ACCIONES Y RESULTADO — SIEMPRE AL FINAL
         Salen de los paneles para quedar debajo de la sección de dirección: al mover la
         dirección fuera del panel de Crear, el botón de crear quedaba a media pantalla y el
         cajero podía darle antes de completar la dirección. _setMode muestra el juego que
         corresponde al modo. -->
    <div id="customerInlineCreateActions" class="customer-inline-dialog__actions" style="display: none;">
        <button id="customerInlineCreateButton" class="customer-inline-dialog__action customer-inline-dialog__action--cta" type="button">2. Crear en Sistema y Asignar</button>
    </div>

    <div id="customerInlineEditActions" class="customer-inline-dialog__actions" style="display: none;">
        <button id="customerInlineEditSunatButton" class="customer-inline-dialog__action customer-inline-dialog__action--secondary" type="button">Validar con SUNAT</button>
        <button id="customerInlineEditButton" class="customer-inline-dialog__action customer-inline-dialog__action--cta" type="button">Guardar Cambios</button>
    </div>

    <div id="customerInlineCreateResult" class="customer-inline-dialog__result" style="display: none;"></div>
    <div id="customerInlineEditResult" class="customer-inline-dialog__result" style="display: none;"></div>

    <div id="customerInlineMessage" class="customer-inline-dialog__message"></div>

    <!-- ALERTA FLOTANTE DE CLIENTE DUPLICADO
         Oculta hasta que _blockDuplicate la llena. El botón principal asigna a la venta el
         cliente que ya existe, que es lo que el cajero necesitaba de todas formas. -->
    <div id="customerInlineAlertOverlay" class="customer-inline-dialog__overlay" style="display: none;">
        <div class="customer-inline-dialog__alert" role="alertdialog" aria-labelledby="customerInlineAlertTitle">
            <p id="customerInlineAlertTitle" class="customer-inline-dialog__alert-title">El cliente ya existe</p>
            <p id="customerInlineAlertBody" class="customer-inline-dialog__alert-body"></p>
            <div class="customer-inline-dialog__alert-actions">
                <button id="customerInlineAlertCancel" class="customer-inline-dialog__action customer-inline-dialog__action--secondary" type="button">Cancelar</button>
                <button id="customerInlineAlertAccept" class="customer-inline-dialog__action" type="button">Aceptar</button>
            </div>
        </div>
    </div>
</div>
